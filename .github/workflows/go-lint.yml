name: Lint go code
on:
  pull_request:
    paths:
      - "app/mise.toml"
      - "**.go"
      - "app/.golangci.yml"

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: app

      - run: mise run lint:go
      - run: mise run fmt:check:go
