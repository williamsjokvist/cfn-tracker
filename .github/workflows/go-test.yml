name: Run go tests
on:
  pull_request:
    paths:
      - "app/mise.toml"
      - "**.go"

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          working_directory: app

      - run: mise test
