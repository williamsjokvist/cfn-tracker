<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFN Tracker v4</title>
    <style>
      * { margin: 0 }

      /* 表示項目が未指定のときだけ出る案内。テーマCSSに依存せず読めるよう
         自前で背景と文字色を持たせる。正しいリンクを使えば描画されないので、
         配信画面に出ることはない。 */
      #setup-hint {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.75em;
        box-sizing: border-box;
        padding: clamp(1rem, 5vw, 3rem);
        background: rgba(20, 6, 30, 0.88);
        color: #f4eaff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: clamp(0.9rem, 2.2vw, 1.1rem);
        line-height: 1.6;
      }
      #setup-hint h1 { font-size: 1.5em; }
      #setup-hint code,
      #setup-hint .example {
        font-family: ui-monospace, Consolas, monospace;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 0.3em;
        padding: 0.15em 0.4em;
      }
      #setup-hint .example { align-self: flex-start; word-break: break-all; }
    </style>
    <link id="theme-css" href="/themes/default.css" rel="stylesheet" />
    <script defer>
      const statDictionaryEN = {
        "cfn": "CFN",
        "userCode": "User Code",
        "character": "Character",
        "lp": "LP",
        "mr": "MR",
        "lpGain": "LP Gain",
        "mrGain": "MR Gain",
        "result": "Result",
        "date": "Date",
        "timestamp": "Time",
        "winRate": "Win Rate",
        "wins": "Wins",
        "losses": "Losses",
        "winStreak": "Win Streak",
        "opponent": "Opponent",
        "opponentCharacter": "Opponent Character",
        "opponentLP": "Opponent LP",
        "opponentMR": "Opponent MR",
        "opponentLeague": "Opponent League",
        "totalWins": "Total Wins",
        "totalLosses": "Total Losses",
        "totalMatches": "Total Matches",
      }

      function formatStat(stat) {
        return statDictionaryEN[stat]
      }

      function formatValue(stat, value) {
        let v = value
        switch (stat) {
          case "result":
            v = value ? "W" : "L";
            break
          case "winRate":
            v = `${value}%`
            break;
          case "lpGain", "mrGain":
            if (value > 0) v = `+${value}`
            break
        }

        return v
      }

      function showSetupHint() {
        const hint = document.createElement("div")
        hint.setAttribute("id", "setup-hint")
        hint.innerHTML = [
          "<h1>No stats selected</h1>",
          "<p>This page only shows the stats listed in the link's query string,",
          "so opening <code>/</code> on its own renders nothing.</p>",
          "<p>In CFN Tracker, open <b>Output</b>, tick the stats you want,",
          "then press <b>Copy browser source link</b> and use that URL here",
          "and in your OBS browser source.</p>",
          "<p class='example'>http://localhost:4242?theme=default&amp;cfn=true&amp;lp=true</p>"
        ].join(" ")
        document.body.appendChild(hint)
      }

      function main() {
        const searchParams = new URLSearchParams(window.location.search);

        // apply theme
        const cssEl = document.getElementById("theme-css")
        cssEl.setAttribute("href", `/themes/${searchParams.get("theme") ?? "default"}.css`)

        // create elements for stats
        const statContainer = document.getElementsByClassName("stat-list")[0]

        const statElements = {}
        for (const [stat, value] of searchParams) {
          if (value != "true") continue;

          const el = document.createElement("div")
          el.classList.add("stat-item")
          el.setAttribute("data-stat", stat)
          el.innerHTML = `<dt class='stat-title'>${formatStat(stat)}</dt><dd class='stat-value'/>`
          statContainer.appendChild(el)

          statElements[stat] = document.querySelector(`.stat-item[data-stat="${stat}"] .stat-value`)
        }

        // No stats were requested, so nothing would ever be drawn. Say so instead of
        // rendering a blank page: an empty overlay is indistinguishable from a broken one.
        // This only shows while the source is misconfigured, so it cannot appear on stream
        // once a proper link is used.
        if (Object.keys(statElements).length === 0) {
          showSetupHint()
          return
        }

        // create listener
        const src = new EventSource("/stream");
        src.addEventListener("open", _ => console.log("The connection has been established"));
        src.addEventListener("error", _ => console.log("An error occurred while attempting to connect"));
        src.addEventListener("message", (e) => {
          const match = JSON.parse(e.data);
          console.log("New match played: ", match);

          for (const [stat, value] of Object.entries(match)) {
            const el = statElements[stat]
            if (el !== undefined) {
              el.innerHTML = formatValue(stat, value)
            }
          }
        })
      }

      document.addEventListener("DOMContentLoaded", main);
    </script>
  </head>
  <body>
    <dl class="stat-list"></dl>
  </body>
</html>
