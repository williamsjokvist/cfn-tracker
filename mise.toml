[tools]
go = "1.25"
bun = "latest"
"go:github.com/wailsapp/wails/v2/cmd/wails" = "2.12.0"

[tasks.dev]
description = "Run the dev server without generating bindings, hot reloading, go mod sync"
dir = "app"
run = "wails dev -skipbindings -noreload -nosyncgomod -nogorebuild"

[tasks.dev-hard]
description = "Run the dev server with codegen, reloading and go mod sync"
dir = "app"
run = "wails dev -forcebuild"

[tasks.bind]
description = "Generate go->ts bindings"
dir = "app"
run = "wails generate module"

[tasks."build:windows-amd64"]
description = "Build for Windows (x86)"
dir = "app"
env = { GOOS = "windows", GOARCH = "amd64" }
run = "wails build"

[tasks."build:windows-arm64"]
description = "Build for Windows (arm)"
dir = "app"
env = { GOOS = "windows", GOARCH = "arm64" }
run = "wails build"

[tasks."build:linux-amd64"]
description = "Build for Linux (x86)"
dir = "app"
env = { GOOS = "linux", GOARCH = "amd64" }
run = "wails build"

[tasks."build:linux-arm64"]
description = "Build for Linux (arm)"
dir = "app"
env = { GOOS = "linux", GOARCH = "arm64" }
run = "wails build"

[tasks."build:mac-amd64"]
description = "Build for Mac (x86)"
dir = "app"
env = { GOOS = "darwin", GOARCH = "amd64" }
run = "wails build"

[tasks."build:mac-arm64"]
description = "Build for Mac (arm)"
dir = "app"
env = { GOOS = "darwin", GOARCH = "arm64" }
run = "wails build"
